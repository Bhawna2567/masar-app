<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Masar — Curriculum Diagnostic & Skill Development</title>
<meta name="theme-color" content="#0b6e4f">
<meta name="description" content="UAE MOE curriculum diagnostic, gap analysis, skill plan and progress tracker for Grades 6–12.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Masar">
<style>
:root{
  --green:#0b6e4f; --green-d:#085138; --gold:#c8a24a; --gold-d:#a9842f;
  --red:#b3261e; --amber:#e6a700; --ok:#1b873f;
  --ink:#1d2733; --muted:#5f6b7a; --line:#e3e8ef; --bg:#f5f7fa; --card:#ffffff;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:var(--green)}
.app{max-width:1080px;margin:0 auto;padding:0 18px 90px}
header.top{background:linear-gradient(120deg,var(--green),var(--green-d));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;border-radius:0 0 16px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.logo{width:42px;height:42px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1d2733;font-size:20px;flex-shrink:0}
.brand h1{margin:0;font-size:20px;letter-spacing:.3px}
.brand p{margin:2px 0 0;font-size:12px;opacity:.85}
#installBtn{margin-left:auto;background:var(--gold);color:#1d2733;border:none;padding:9px 14px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;display:none}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s}
nav.tabs button:hover{border-color:var(--green)}
nav.tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
nav.tabs button:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:18px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:220px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--green)}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--green);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--green-d)}
.btn.gold{background:var(--gold);color:#1d2733}.btn.gold:hover{background:var(--gold-d)}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn.ghost:hover{background:#f0f6f3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.3px}
.pill.green{background:#e5f3ec;color:var(--ok)}
.pill.amber{background:#fdf3da;color:var(--gold-d)}
.pill.red{background:#fbe7e6;color:var(--red)}
.pill.grey{background:#eef1f5;color:var(--muted)}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.q .meta{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.q .stem{font-size:15px;font-weight:600;margin-bottom:12px}
.opt{display:block;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:14px;transition:.12s}
.opt:hover{border-color:var(--green);background:#f6faf8}
.opt input{width:auto;margin-right:10px}
.opt.sel{border-color:var(--green);background:#eef7f2}
.bar{height:10px;border-radius:6px;background:#eef1f5;overflow:hidden}
.bar > span{display:block;height:100%;border-radius:6px;background:var(--green)}
.kpi{display:flex;gap:14px;flex-wrap:wrap}
.kpi .box{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.kpi .box .n{font-size:26px;font-weight:800}
.kpi .box .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.skillrow td{vertical-align:middle}
.muted{color:var(--muted)}
.center{text-align:center}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:10px}
.folder{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.folder .fh{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;background:#fafbfc}
.folder .fh:hover{background:#f3f6f9}
.folder .fh .ft{font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.folder .body{padding:6px 16px 14px;display:none}
.folder.open .body{display:block}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:none}
.task input{width:auto;margin-top:3px}
.task .tt{font-size:14px}
.task .ts{font-size:12px;color:var(--muted)}
.chartwrap{display:flex;align-items:flex-end;gap:10px;height:170px;padding:10px 0;border-bottom:1px solid var(--line)}
.chartwrap .colbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.chartwrap .colbar .vb{width:70%;background:var(--green);border-radius:6px 6px 0 0;transition:.4s;min-height:2px}
.chartwrap .colbar .vb.plan{background:var(--gold)}
.legend{display:flex;gap:16px;font-size:12px;margin-top:10px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.notice{background:#fff8e8;border:1px solid #f0e2b8;border-radius:10px;padding:12px 14px;font-size:13px;color:#7a5d00;margin-bottom:16px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tag{font-size:11px;background:#eef1f5;color:var(--muted);padding:2px 8px;border-radius:6px;font-weight:700}
.termtag{font-size:10px;background:#eef7f2;color:var(--green);border:1px solid #cfe6da;padding:1px 6px;border-radius:5px;font-weight:700;margin-right:6px}
.print-only{display:none}
@media print{nav.tabs,header.top .brand p,#installBtn,.no-print{display:none!important}.app{padding:0}.print-only{display:block}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">م</div>
  <div class="brand">
    <h1>Masar <span style="font-weight:400;opacity:.8;font-size:14px">مسار</span></h1>
    <p>UAE MOE Curriculum Diagnostic &amp; Skill Development · Grades 6–12 · English &amp; Math</p>
  </div>
  <button id="installBtn">⤓ Install app</button>
</header>

<div class="app">
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</div>

<!-- Curriculum data (auto-generated from the official MOE files). Replace this file to extend. -->
<script src="curriculum.js"></script>
<script>
/* ============================================================
   MASAR — app logic; curriculum lives in curriculum.js.
   ============================================================ */
if (typeof CURRICULUM === "undefined") { window.CURRICULUM = {}; }

const GRADES = [
  {id:"6",label:"Grade 6"},{id:"7",label:"Grade 7"},{id:"8",label:"Grade 8"},
  {id:"9A",label:"Grade 9 Advanced"},{id:"9G",label:"Grade 9 General"},
  {id:"10A",label:"Grade 10 Advanced"},{id:"10G",label:"Grade 10 General"},
  {id:"11A",label:"Grade 11 Advanced"},{id:"11G",label:"Grade 11 General"},
  {id:"12A",label:"Grade 12 Advanced"},{id:"12G",label:"Grade 12 General"}
];
const ENG_SKILLS = ["Reading","Writing","Vocabulary","Grammar"];
const MATH_SKILLS = ["Number & Operations","Algebra","Geometry","Data & Probability"];

const QUESTION_BANK = {
  "6":{
    English:[
      {skill:"Reading",q:"\"Although the team lost, they walked off smiling, proud of how far they'd come.\" Which theme does this best convey?",options:["Winning is everything","Growth matters more than winning","Sports are dangerous","Teams should not smile"],answer:1},
      {skill:"Reading",q:"Which sentence is the BEST textual evidence that a character is generous?",options:["He owned a large house.","He quietly paid for a stranger's meal.","He walked to the shop.","He liked the colour blue."],answer:1},
      {skill:"Reading",q:"Two articles describe the same storm — one uses eyewitness quotes, the other weather data. Comparing them shows that:",options:["They must disagree","Different texts can present one event from different angles","Only one can be true","Neither is useful"],answer:1},
      {skill:"Writing",q:"In a well-structured essay, the main claim (thesis) usually appears:",options:["Only in the title","In the introduction","Randomly in the middle","It is never stated"],answer:1},
      {skill:"Writing",q:"Choose the best transition to show contrast: \"I trained hard. ___, I did not win.\"",options:["Therefore","However","For example","Finally"],answer:1},
      {skill:"Writing",q:"Which is the STRONGEST support for an argument that schools should start later?",options:["I just think so.","A study found later starts improved student test scores.","My friend agrees.","Mornings are cold."],answer:1},
      {skill:"Vocabulary",q:"\"Her smile was sunshine.\" This is an example of a:",options:["simile","metaphor","question","command"],answer:1},
      {skill:"Vocabulary",q:"The Greek root \"bio\" in \"biology\" means:",options:["earth","life","sound","water"],answer:1},
      {skill:"Vocabulary",q:"\"Childish\" and \"youthful\" both relate to being young, but \"childish\" carries a ___ connotation.",options:["positive","negative","neutral","scientific"],answer:1},
      {skill:"Grammar",q:"Choose the present perfect tense: \"She ___ her homework already.\"",options:["finish","finished","has finished","finishing"],answer:2},
      {skill:"Grammar",q:"Choose the correct verb: \"The list of items ___ on the desk.\"",options:["are","is","were","be"],answer:1},
      {skill:"Grammar",q:"Choose the correct pronoun: \"Neither of the boys finished ___ lunch.\"",options:["their","his","they","them"],answer:1}
    ],
    Math:[
      {skill:"Number & Operations",q:"What is 2/3 + 1/6?",options:["3/9","5/6","1/2","3/6"],answer:1},
      {skill:"Number & Operations",q:"What is 0.25 × 4?",options:["1","0.1","10","0.025"],answer:0},
      {skill:"Number & Operations",q:"A recipe uses 2 cups of flour for 3 people. The unit rate per person is:",options:["2/3 cup","3/2 cup","6 cups","1 cup"],answer:0},
      {skill:"Algebra",q:"Evaluate 3x + 5 when x = 4.",options:["12","17","23","20"],answer:1},
      {skill:"Algebra",q:"Solve: x + 7 = 12.",options:["5","19","7","6"],answer:0},
      {skill:"Algebra",q:"If y is proportional to x and y = 10 when x = 2, find y when x = 5.",options:["13","25","20","15"],answer:1},
      {skill:"Geometry",q:"Area of a triangle with base 8 and height 5:",options:["40","20","13","26"],answer:1},
      {skill:"Geometry",q:"Volume of a box 2 × 3 × 4:",options:["9","24","14","12"],answer:1},
      {skill:"Geometry",q:"A figure is a 4×4 square joined to a 4×2 rectangle. Total area:",options:["16","24","20","32"],answer:1},
      {skill:"Data & Probability",q:"Data: 4, 8, 8, 12, 18. The median is:",options:["8","12","10","18"],answer:0},
      {skill:"Data & Probability",q:"The mean of 6, 10, 14 is:",options:["10","30","12","9"],answer:0},
      {skill:"Data & Probability",q:"A histogram differs from a bar graph because it shows:",options:["unrelated categories","data grouped in equal numeric intervals","only one value","no data"],answer:1}
    ]
  }
};

const LS_KEY="masar_state_v3";
let S = load() || {student:null,answers:{},result:null,plan:null,taskDone:{},activeTab:"setup"};
function load(){try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(S))}
function reset(){if(confirm("Clear all data and start over?")){localStorage.removeItem(LS_KEY);location.reload();}}

const gLabel = id => (GRADES.find(g=>g.id===id)||{}).label||id;
const skillsFor = subj => subj==="Math"?MATH_SKILLS:ENG_SKILLS;
function levelFromPct(p){ if(p>=80)return{name:"On Track / Advanced",cls:"green"}; if(p>=60)return{name:"Approaching",cls:"amber"}; if(p>=40)return{name:"Developing",cls:"amber"}; return{name:"Needs Intensive Support",cls:"red"}; }
function rag(p){ return p>=80?"green":p>=55?"amber":"red"; }
function curriculumFor(grade, subj, skill){
  let out=[];
  ["1","2","3"].forEach(t=>{
    const arr=(CURRICULUM[grade]&&CURRICULUM[grade][t]&&CURRICULUM[grade][t][subj]&&CURRICULUM[grade][t][subj][skill])||[];
    arr.forEach(x=>{ if(x && !x.startsWith("(Upload")) out.push({term:t,text:x}); });
  });
  return out;
}

const TABS=[
  {id:"setup",label:"1 · Student Setup",always:true},
  {id:"diagnostic",label:"2 · Diagnostic Test",need:"student"},
  {id:"results",label:"3 · Level & Results",need:"result"},
  {id:"gaps",label:"4 · Gap Analysis",need:"result"},
  {id:"report",label:"5 · Parent/Teacher Report",need:"result"},
  {id:"plan",label:"6 · Skill Development Plan",need:"result"},
  {id:"folders",label:"7 · Weekly Folders",need:"plan"},
  {id:"tracker",label:"8 · Progress Tracker",need:"plan"},
  {id:"curriculum",label:"📚 Curriculum",need:"student"}
];
function tabEnabled(t){ if(t.always)return true; if(t.need==="student")return !!S.student; if(t.need==="result")return !!S.result; if(t.need==="plan")return !!S.plan; return true; }
function renderTabs(){
  const el=document.getElementById("tabs"); el.innerHTML="";
  TABS.forEach(t=>{
    const b=document.createElement("button");
    b.textContent=t.label; b.disabled=!tabEnabled(t);
    if(S.activeTab===t.id)b.classList.add("active");
    b.onclick=()=>{S.activeTab=t.id;save();render();};
    el.appendChild(b);
  });
  const rb=document.createElement("button");rb.textContent="↺ Reset";rb.className="no-print";rb.onclick=reset;rb.style.marginLeft="auto";el.appendChild(rb);
}

function render(){
  renderTabs();
  const v=document.getElementById("view");
  const map={setup:viewSetup,diagnostic:viewDiagnostic,results:viewResults,gaps:viewGaps,report:viewReport,plan:viewPlan,folders:viewFolders,tracker:viewTracker,curriculum:viewCurriculum};
  if(!tabEnabled(TABS.find(t=>t.id===S.activeTab))){S.activeTab="setup";}
  v.innerHTML=map[S.activeTab]();
  window.scrollTo(0,0);
}

function viewSetup(){
  const s=S.student||{};
  const opts=GRADES.map(g=>`<option value="${g.id}" ${s.curGrade===g.id?"selected":""}>${g.label}</option>`).join("");
  const optsPrev=GRADES.map(g=>`<option value="${g.id}" ${s.prevGrade===g.id?"selected":""}>${g.label}</option>`).join("");
  return `
  <div class="card">
    <h2>Student Setup</h2>
    <p class="sub">The diagnostic is built from the <b>previous grade</b> curriculum. Gap analysis compares it to the <b>current grade</b>.</p>
    <div class="notice">📁 <b>Full curriculum loaded:</b> Official MOE <b>English (Terms 1–3)</b> and <b>Mathematics (Terms 1–3)</b> are embedded for <b>Grades 6–12</b>, Advanced and General. Grades 9–12 Maths is by unit; Grades 6–8 Maths is translated from the Arabic guides. Browse it all in the <b>📚 Curriculum</b> tab.</div>
    <div class="row">
      <div class="col"><label>Student name</label><input id="f_name" value="${s.name||""}" placeholder="e.g. Ahmed Al Mansoori"></div>
      <div class="col"><label>Subject</label>
        <select id="f_subject"><option value="English" ${s.subject==="English"?"selected":""}>English</option><option value="Math" ${s.subject==="Math"?"selected":""}>Mathematics</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="col"><label>Previous grade (completed)</label><select id="f_prev">${optsPrev}</select></div>
      <div class="col"><label>Current grade (promoted to)</label><select id="f_cur">${opts}</select></div>
    </div>
    <div style="margin-top:20px"><button class="btn" onclick="saveStudent()">Save &amp; continue →</button></div>
  </div>
  ${S.student?`<div class="card"><h2>Current student</h2><p class="sub">Saved profile</p>
    <div class="kpi">
      <div class="box"><div class="n" style="font-size:18px">${S.student.name||"—"}</div><div class="l">Name</div></div>
      <div class="box"><div class="n" style="font-size:18px">${S.student.subject}</div><div class="l">Subject</div></div>
      <div class="box"><div class="n" style="font-size:18px">${gLabel(S.student.prevGrade)}</div><div class="l">Previous</div></div>
      <div class="box"><div class="n" style="font-size:18px">${gLabel(S.student.curGrade)}</div><div class="l">Current</div></div>
    </div></div>`:""}
  `;
}
function saveStudent(){
  const name=document.getElementById("f_name").value.trim();
  const subject=document.getElementById("f_subject").value;
  const prevGrade=document.getElementById("f_prev").value;
  const curGrade=document.getElementById("f_cur").value;
  if(!name){alert("Please enter the student's name.");return;}
  const changed=!S.student||S.student.prevGrade!==prevGrade||S.student.subject!==subject;
  S.student={name,subject,prevGrade,curGrade};
  if(changed){S.answers={};S.result=null;S.plan=null;S.taskDone={};}
  S.activeTab="diagnostic";save();render();
}

function getQuestions(){
  const g=S.student.prevGrade, subj=S.student.subject;
  return (QUESTION_BANK[g]&&QUESTION_BANK[g][subj])?QUESTION_BANK[g][subj]:null;
}
function viewDiagnostic(){
  const qs=getQuestions();
  if(!qs){return `<div class="card"><h2>Diagnostic Test</h2>
    <div class="empty"><div class="big">📝</div>
    A question bank for <b>${gLabel(S.student.prevGrade)} · ${S.student.subject}</b> hasn't been added yet.<br>
    The curriculum for this grade is loaded (see Gap Analysis &amp; Curriculum), but diagnostic <b>items</b> still need to be authored.<br>
    To try the full demo now, set <b>previous = Grade 6</b> and <b>current = Grade 7</b>.</div></div>`;}
  let html=`<div class="card"><h2>Diagnostic Test — based on ${gLabel(S.student.prevGrade)} ${S.student.subject}</h2>
    <p class="sub">${S.student.name} is entering ${gLabel(S.student.curGrade)}. This test checks mastery of the prior grade before measuring readiness for the new one.</p>`;
  qs.forEach((q,i)=>{
    html+=`<div class="q"><div class="meta">${q.skill}</div><div class="stem">Q${i+1}. ${q.q}</div>`;
    q.options.forEach((o,oi)=>{
      const sel=S.answers[i]===oi;
      html+=`<label class="opt ${sel?"sel":""}" id="opt-${i}-${oi}"><input type="radio" name="q${i}" ${sel?"checked":""} onchange="pick(${i},${oi})">${o}</label>`;
    });
    html+=`</div>`;
  });
  const answered=Object.keys(S.answers).length;
  html+=`<div class="flex-between"><span class="muted">${answered}/${qs.length} answered</span>
    <button class="btn gold" onclick="grade()" ${answered<qs.length?"disabled":""}>Submit &amp; analyse →</button></div></div>`;
  return html;
}
function pick(i,oi){S.answers[i]=oi;save();
  const qs=getQuestions();qs[i].options.forEach((_,k)=>{const el=document.getElementById(`opt-${i}-${k}`);if(el)el.classList.toggle("sel",k===oi);});
  const answered=Object.keys(S.answers).length;const btn=document.querySelector(".btn.gold");if(btn)btn.disabled=answered<qs.length;
  const span=document.querySelector(".flex-between .muted");if(span)span.textContent=`${answered}/${qs.length} answered`;
}

function grade(){
  const qs=getQuestions();
  const subj=S.student.subject, areas=skillsFor(subj);
  const per={}; areas.forEach(a=>per[a]={correct:0,total:0});
  let correct=0;
  qs.forEach((q,i)=>{ per[q.skill].total++; if(S.answers[i]===q.answer){correct++;per[q.skill].correct++;} });
  const overallPct=Math.round(correct/qs.length*100);
  const skillPct={}; areas.forEach(a=>{ skillPct[a]= per[a].total? Math.round(per[a].correct/per[a].total*100):0; });
  S.result={ when:new Date().toISOString(), overallPct, correct, total:qs.length, skillPct, per, level:levelFromPct(overallPct) };
  S.plan=generatePlan();
  S.activeTab="results"; save(); render();
}

function viewResults(){
  const r=S.result, subj=S.student.subject, areas=skillsFor(subj);
  const lvl=r.level;
  let rows=areas.map(a=>{
    const p=r.skillPct[a]; const c=rag(p);
    return `<tr class="skillrow"><td><b>${a}</b></td>
      <td style="width:45%"><div class="bar"><span style="width:${p}%;background:var(--${c==='green'?'ok':c==='amber'?'amber':'red'})"></span></div></td>
      <td>${p}%</td><td>${r.per[a].correct}/${r.per[a].total}</td>
      <td><span class="pill ${c}">${p>=80?"Strong":p>=55?"Developing":"Gap"}</span></td></tr>`;
  }).join("");
  return `
  <div class="card">
    <h2>Diagnostic Results — ${S.student.name}</h2>
    <p class="sub">Based on ${gLabel(S.student.prevGrade)} ${subj} · taken ${new Date(r.when).toLocaleDateString()}</p>
    <div class="kpi">
      <div class="box"><div class="n">${r.overallPct}%</div><div class="l">Overall Score</div></div>
      <div class="box"><div class="n">${r.correct}/${r.total}</div><div class="l">Correct</div></div>
      <div class="box"><div class="n"><span class="pill ${lvl.cls}" style="font-size:13px">${lvl.name}</span></div><div class="l">Placed Level</div></div>
      <div class="box"><div class="n" style="font-size:18px">${gLabel(S.student.curGrade)}</div><div class="l">Current Grade</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Skill breakdown</h2>
    <p class="sub">Mastery of prior-grade skills, by ${subj==="Math"?"strand":"language skill"}</p>
    <table><thead><tr><th>Skill</th><th>Mastery</th><th>%</th><th>Items</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="muted" style="font-size:12px;margin-top:14px">Placement logic: ≥80% Advanced/On-track · 60–79% Approaching · 40–59% Developing · &lt;40% Needs intensive support. Any skill below 55% is flagged as a gap and targeted in the development plan.</p>
  </div>`;
}

function gapData(){
  const subj=S.student.subject, areas=skillsFor(subj);
  const prevG=S.student.prevGrade, curG=S.student.curGrade;
  return areas.map(a=>{
    const p=S.result.skillPct[a];
    return {skill:a,pct:p,status:rag(p),prev:curriculumFor(prevG,subj,a),cur:curriculumFor(curG,subj,a),gap:p<55};
  });
}
function termList(items){
  if(!items.length) return `<li>—</li>`;
  return items.map(o=>`<li><span class="termtag">T${o.term}</span>${o.text}</li>`).join("");
}
function viewGaps(){
  const data=gapData(), subj=S.student.subject;
  let blocks=data.map(d=>{
    return `<div class="card">
      <div class="flex-between"><h2>${d.skill}</h2><span class="pill ${d.status}">${d.pct}% mastery · ${d.gap?"GAP":"OK"}</span></div>
      <p class="sub">Bridging from ${gLabel(S.student.prevGrade)} to ${gLabel(S.student.curGrade)} · outcomes across loaded terms</p>
      <div class="row">
        <div class="col"><label>Where the student is (prior grade)</label>
          <ul style="margin:6px 0;padding-left:18px;font-size:13px">${termList(d.prev)}</ul></div>
        <div class="col"><label>Where they must be (current grade)</label>
          <ul style="margin:6px 0;padding-left:18px;font-size:13px">${termList(d.cur)}</ul></div>
      </div>
      ${d.gap?`<div class="notice" style="margin-top:8px">⚠ Priority gap — diagnostic mastery ${d.pct}%. The current-grade outcomes are at risk without targeted support. Included in the development plan.</div>`:`<div class="muted" style="font-size:13px;margin-top:6px">✓ Solid foundation — the student is ready to build the current-grade skills with normal classroom pacing.</div>`}
    </div>`;
  }).join("");
  const gapCount=data.filter(d=>d.gap).length;
  return `<div class="card"><h2>Gap Analysis</h2><p class="sub">Comparing prior mastery against current-grade demands for ${subj} (Term 1–3 outcomes shown where loaded).</p>
    <div class="kpi"><div class="box"><div class="n">${gapCount}</div><div class="l">Priority gaps</div></div>
    <div class="box"><div class="n">${data.length-gapCount}</div><div class="l">Solid skills</div></div>
    <div class="box"><div class="n">${S.result.overallPct}%</div><div class="l">Overall readiness</div></div></div></div>${blocks}`;
}

function viewReport(){
  const r=S.result, data=gapData(), subj=S.student.subject;
  const gaps=data.filter(d=>d.gap), strong=data.filter(d=>!d.gap);
  const narrative=`${S.student.name} completed a diagnostic based on the ${gLabel(S.student.prevGrade)} ${subj} curriculum, scoring <b>${r.overallPct}%</b> overall, which places the student at the <b>${r.level.name}</b> level entering ${gLabel(S.student.curGrade)}. `+
    (gaps.length? `The student shows strength in ${strong.map(s=>s.skill).join(", ")||"few areas"}, but needs targeted support in <b>${gaps.map(g=>g.skill).join(", ")}</b> to meet the demands of the new grade.`:
    `The student demonstrates a solid foundation across all assessed skills and is well-positioned for ${gLabel(S.student.curGrade)}.`);
  let rows=data.map(d=>`<tr><td><b>${d.skill}</b></td><td>${d.pct}%</td>
    <td><span class="pill ${d.status}">${d.gap?"Needs support":"On track"}</span></td>
    <td style="font-size:12px">${d.gap?"Targeted activities in weekly plan":"Maintain via classroom work"}</td></tr>`).join("");
  return `<div class="card no-print"><div class="flex-between"><h2>Parent &amp; Teacher Report</h2>
    <button class="btn ghost sm" onclick="window.print()">🖨 Print / Save PDF</button></div>
    <p class="sub">Shareable summary of where the student is and where they need to be.</p></div>
  <div class="card">
    <div class="print-only" style="margin-bottom:10px"><b>MASAR — Student Diagnostic Report</b></div>
    <div class="flex-between"><div><h2 style="margin-bottom:2px">${S.student.name}</h2>
      <span class="tag">${subj}</span> <span class="tag">${gLabel(S.student.prevGrade)} → ${gLabel(S.student.curGrade)}</span> <span class="tag">${new Date(r.when).toLocaleDateString()}</span></div>
      <span class="pill ${r.level.cls}" style="font-size:14px">${r.level.name}</span></div>
    <h3 style="margin:18px 0 6px;font-size:14px">Summary</h3>
    <p style="font-size:14px">${narrative}</p>
    <h3 style="margin:18px 0 6px;font-size:14px">Comparative analysis — current vs target</h3>
    <table><thead><tr><th>Skill</th><th>Mastery</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>
    <h3 style="margin:18px 0 6px;font-size:14px">What happens next</h3>
    <p style="font-size:14px">A 3-term skill development plan has been generated targeting the gap areas. Each term is broken into weekly folders of activities. Progress is tracked against the plan so parents and teachers can see, week by week, whether ${S.student.name.split(" ")[0]} is on pace to close the gaps before the end of the year.</p>
    <p class="muted" style="font-size:12px;margin-top:18px">Generated by Masar · This report reflects a diagnostic snapshot and should be read alongside classroom assessment.</p>
  </div>`;
}

const ACTIVITY_LIB={
  Reading:["Read a short text and write the main idea + 2 details","Highlight evidence that supports an inference","Compare two short articles on the same topic","Summarise a passage in 3 sentences","Answer 5 inference questions on a leveled text"],
  Writing:["Draft a paragraph with topic sentence + 3 details","Add transition words to a given paragraph","Write a 5-sentence opinion with one reason","Revise a paragraph for punctuation & capitals","Plan and write a short multi-paragraph piece"],
  Vocabulary:["Learn 5 new academic words + use each in a sentence","Match 8 synonyms and antonyms","Break 5 words into prefix/root/suffix","Use context clues to define 5 unknown words","Identify simile vs metaphor in 6 examples"],
  Grammar:["Label nouns/verbs/adjectives in 8 sentences","Fix subject–verb agreement in 6 sentences","Convert 6 sentences between tenses","Punctuate a paragraph correctly","Combine simple sentences using conjunctions"],
  "Number & Operations":["20 multi-digit +/− problems","15 multiplication problems (2-digit)","Fraction addition practice (10)","Decimal & place-value challenge (10)","Word problems involving division (8)"],
  "Algebra":["Solve 10 missing-number equations","Continue & describe 6 number patterns","Evaluate 8 simple expressions","Build an input/output table (5)","Solve 6 one-step equations"],
  "Geometry":["Find perimeter of 8 rectangles","Find area of 8 rectangles","Classify 10 shapes by attributes","Measure & draw 5 shapes","Composite-figure area (5)"],
  "Data & Probability":["Read & answer questions on 3 bar graphs","Find mean/median/mode/range of 4 sets","Simple probability of 8 events","Build a bar graph from data","Interpret a line plot (5 questions)"]
};
function generatePlan(){
  const subj=S.student.subject, areas=skillsFor(subj);
  const gaps=areas.filter(a=>S.result.skillPct[a]<55);
  const focus = gaps.length?gaps:areas.slice();
  const WEEKS=6;
  const terms={};
  ["1","2","3"].forEach((t,ti)=>{
    const weeks=[];
    for(let w=1;w<=WEEKS;w++){
      const skill=focus[(w-1)%focus.length];
      const lib=ACTIVITY_LIB[skill]||["Practice activity"];
      const tasks=[lib[(w-1)%lib.length],lib[(w)%lib.length]];
      weeks.push({week:w,skill,tasks});
    }
    terms[t]={ goal:`By end of Term ${t}: raise ${focus.join(", ")} toward grade-level mastery (target ${60+ti*10}%+).`, weeks };
  });
  return {focus,termWeeks:WEEKS,terms,createdFrom:S.result.when};
}

function viewPlan(){
  const p=S.plan, subj=S.student.subject;
  let terms=["1","2","3"].map(t=>{
    const tm=p.terms[t];
    return `<div class="card"><div class="flex-between"><h2>Term ${t}</h2><span class="tag">${p.termWeeks} weeks</span></div>
      <p class="sub">${tm.goal}</p>
      <table><thead><tr><th>Week</th><th>Focus skill</th><th>Activities</th></tr></thead><tbody>
      ${tm.weeks.map(w=>`<tr><td>W${w.week}</td><td><b>${w.skill}</b></td><td style="font-size:13px">${w.tasks.join("<br>")}</td></tr>`).join("")}
      </tbody></table></div>`;
  }).join("");
  return `<div class="card"><h2>Skill Development Plan</h2>
    <p class="sub">3 terms · targeting ${p.focus.length} focus ${p.focus.length===1?"skill":"skills"} for ${S.student.name} in ${subj}.</p>
    <div class="kpi">${p.focus.map(f=>`<div class="box"><div class="n" style="font-size:14px">${f}</div><div class="l">${S.result.skillPct[f]}% → target</div></div>`).join("")}</div>
    <p class="muted" style="font-size:12px;margin-top:14px">Focus skills are those below 55% on the diagnostic. The plan distributes practice across 3 terms, raising the target band each term. Open <b>Weekly Folders</b> to work through tasks and the <b>Tracker</b> to monitor pace.</p>
  </div>${terms}`;
}

function viewFolders(){
  const p=S.plan;
  let html=`<div class="card"><h2>Weekly Folders</h2><p class="sub">Each term holds weekly folders. Tick tasks as ${S.student.name.split(" ")[0]} completes them — progress feeds the tracker.</p></div>`;
  ["1","2","3"].forEach(t=>{
    html+=`<div class="card"><h2 style="margin-bottom:12px">Term ${t}</h2>`;
    p.terms[t].weeks.forEach(w=>{
      const id=`f-${t}-${w.week}`;
      const done=w.tasks.filter((_,i)=>S.taskDone[`${t}-${w.week}-${i}`]).length;
      html+=`<div class="folder ${(t==="1"&&w.week===1)?"open":""}" id="${id}">
        <div class="fh" onclick="document.getElementById('${id}').classList.toggle('open')">
          <div class="ft">📁 Week ${w.week} — ${w.skill}</div>
          <span class="pill ${done===w.tasks.length?"green":done>0?"amber":"grey"}">${done}/${w.tasks.length} done</span>
        </div>
        <div class="body">
          ${w.tasks.map((tk,i)=>{const key=`${t}-${w.week}-${i}`;const ck=!!S.taskDone[key];
            return `<div class="task"><input type="checkbox" ${ck?"checked":""} onchange="toggleTask('${key}','${id}')">
            <div><div class="tt" style="${ck?'text-decoration:line-through;color:#8a94a3':''}">${tk}</div>
            <div class="ts">${w.skill} · Week ${w.week} activity</div></div></div>`;}).join("")}
        </div></div>`;
    });
    html+=`</div>`;
  });
  return html;
}
function toggleTask(key,folderId){
  S.taskDone[key]=!S.taskDone[key];save();
  const open=document.querySelectorAll(".folder.open");const openIds=[...open].map(o=>o.id);
  render();
  openIds.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add("open");});
}

function termProgress(t){
  const p=S.plan;let total=0,done=0;
  p.terms[t].weeks.forEach(w=>w.tasks.forEach((_,i)=>{total++;if(S.taskDone[`${t}-${w.week}-${i}`])done++;}));
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function viewTracker(){
  const p=S.plan;
  const t1=termProgress("1"),t2=termProgress("2"),t3=termProgress("3");
  const totalDone=t1.done+t2.done+t3.done, totalAll=t1.total+t2.total+t3.total;
  const yearPct=totalAll?Math.round(totalDone/totalAll*100):0;
  const terms=[{k:"1",d:t1},{k:"2",d:t2},{k:"3",d:t3}];
  const planTarget=[100,100,100];
  const chart=`<div class="chartwrap">${terms.map((x,i)=>`
    <div class="colbar"><span style="font-size:11px;font-weight:700">${x.d.pct}%</span>
      <div style="display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center">
        <div class="vb" style="height:${x.d.pct}%" title="Actual"></div>
        <div class="vb plan" style="height:${planTarget[i]}%;opacity:.5" title="Plan target"></div>
      </div>
      <span style="font-size:11px;color:var(--muted)">Term ${x.k}</span></div>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>Actual completion</span><span><i style="background:var(--gold)"></i>Plan target</span></div>`;
  const onPace = yearPct>=Math.round((t1.total/totalAll)*100*0.6);
  let skillBreak = p.focus.map(f=>{
    let d=0,tt=0;
    ["1","2","3"].forEach(t=>p.terms[t].weeks.forEach(w=>{if(w.skill===f)w.tasks.forEach((_,i)=>{tt++;if(S.taskDone[`${t}-${w.week}-${i}`])d++;});}));
    const pct=tt?Math.round(d/tt*100):0;
    return `<tr><td><b>${f}</b></td><td>${S.result.skillPct[f]}%</td>
      <td style="width:40%"><div class="bar"><span style="width:${pct}%"></span></div></td><td>${pct}%</td>
      <td><span class="pill ${pct>=60?"green":pct>0?"amber":"grey"}">${pct>=60?"Improving":pct>0?"Started":"Not started"}</span></td></tr>`;
  }).join("");
  return `<div class="card"><h2>Progress Tracker</h2><p class="sub">Achievement across each term and the full year, against the development plan.</p>
    <div class="kpi">
      <div class="box"><div class="n">${yearPct}%</div><div class="l">Year completion</div></div>
      <div class="box"><div class="n">${totalDone}/${totalAll}</div><div class="l">Tasks done</div></div>
      <div class="box"><div class="n">${t1.pct}%</div><div class="l">Term 1</div></div>
      <div class="box"><div class="n"><span class="pill ${yearPct>0?(onPace?'green':'amber'):'grey'}">${yearPct===0?"Not started":onPace?"On pace":"Behind pace"}</span></div><div class="l">Status</div></div>
    </div></div>
    <div class="card"><h2>Completion by term</h2><p class="sub">Actual vs plan target</p>${chart}</div>
    <div class="card"><h2>Improvement by focus skill</h2><p class="sub">Diagnostic baseline → activities completed</p>
    <table><thead><tr><th>Skill</th><th>Baseline</th><th>Plan progress</th><th>%</th><th>Trend</th></tr></thead><tbody>${skillBreak}</tbody></table>
    <p class="muted" style="font-size:12px;margin-top:12px">As tasks are ticked in Weekly Folders, this view updates automatically. In the production version, periodic re-tests re-measure mastery and plot the real skill-growth curve against the target line.</p></div>`;
}

function curState(){ S.curView=S.curView||{grade:(S.student?S.student.curGrade:"6"),subject:(S.student?S.student.subject:"English")}; return S.curView; }
function setCur(k,v){ const c=curState(); c[k]=v; save(); render(); }
function viewCurriculum(){
  const c=curState();
  const gopts=GRADES.map(g=>`<option value="${g.id}" ${c.grade===g.id?"selected":""}>${g.label}</option>`).join("");
  let loadedTerms=0, body="";
  ["1","2","3"].forEach(t=>{
    const data=(CURRICULUM[c.grade]&&CURRICULUM[c.grade][t]&&CURRICULUM[c.grade][t][c.subject])||{};
    const strands=Object.keys(data);
    const anyReal=strands.some(st=>(data[st]||[]).some(x=>x&&!x.startsWith("(")));
    if(anyReal) loadedTerms++;
    let inner=strands.map(st=>{
      const items=(data[st]||[]).filter(x=>x);
      const real=items.length && !items[0].startsWith("(");
      return `<div style="margin-bottom:12px"><div style="font-weight:700;font-size:14px;margin-bottom:4px">${st}</div>
        <ul style="margin:4px 0;padding-left:18px;font-size:13px;color:${real?'var(--ink)':'var(--muted)'}">${(items.length?items:["—"]).map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
    }).join("");
    body+=`<div class="card"><div class="flex-between"><h2>Term ${t}</h2><span class="tag">${strands.length} ${c.subject==="Math"?"unit(s)/strand(s)":"skill(s)"}</span></div>${inner||'<p class="muted" style="font-size:13px">No data yet.</p>'}</div>`;
  });
  return `<div class="card"><h2>Curriculum Browser</h2>
    <p class="sub">Official MOE outcomes embedded in the app — ${loadedTerms} of 3 terms loaded for ${gLabel(c.grade)} ${c.subject==="Math"?"Mathematics":"English"}.</p>
    <div class="row">
      <div class="col"><label>Grade</label><select onchange="setCur('grade',this.value)">${gopts}</select></div>
      <div class="col"><label>Subject</label><select onchange="setCur('subject',this.value)"><option value="English" ${c.subject==='English'?'selected':''}>English</option><option value="Math" ${c.subject==='Math'?'selected':''}>Mathematics</option></select></div>
    </div>
    <p class="muted" style="font-size:12px;margin-top:12px">English: Reading, Writing, Vocabulary, Grammar (Terms 1–3). Mathematics: Grades 9–12 organised by unit; Grades 6–8 translated from the official Arabic guides and grouped by domain (Terms 1–3).</p>
  </div>${body}`;
}
